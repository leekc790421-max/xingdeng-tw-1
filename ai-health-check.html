<script>
document.getElementById('health-form').addEventListener('submit',function(e){
e.preventDefault();
var f=this;
var d=new FormData(f);
// 組合痛點
var pains=d.getAll('痛點');
var painText=pains.length?pains.map(function(p){return '- '+p}).join('\n'):'未選擇';

submitData.append('公司名稱',d.get('公司名稱'));
submitData.append('聯絡人姓名',d.get('聯絡人姓名'));
submitData.append('Email',d.get('Email'));
submitData.append('產業類別',d.get('產業類別')||'未填寫');
submitData.append('員工規模',d.get('員工規模')||'未填寫');
submitData.append('已使用AI',d.get('已使用AI')||'未填寫');
submitData.append('痛點',painText);
submitData.append('表單類型','AI 健檢問卷');
// 提交到 Formspree
fetch(f.action,{method:'POST',body:submitData,headers:{'Accept':'application/json'}})
.then(function(r){
document.getElementById('form-section').classList.add('hidden');
document.getElementById('success-section').classList.remove('hidden');
})
.catch(function(err){
document.getElementById('form-section').classList.add('hidden');
document.getElementById('success-section').classList.remove('hidden');
});
});
